<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Boccia Labeler · 검수 화면 시안 v2</title>
<style>
:root{
  --bg0:#0d0f12; --bg1:#15181c; --bg2:#1c2025; --bg3:#252a31; --bg4:#2f353d;
  --line:#2a3038; --line2:#3b434d;
  --tx1:#e8ebef; --tx2:#a5aeba; --tx3:#727c88;
  --accent:#5b9dff; --accent-bg:rgba(91,157,255,.15);
  --ok:#3dd68c; --ok-bg:rgba(61,214,140,.14); --ok-fill:#1f9d63;
  --hold:#f5b544; --hold-bg:rgba(245,181,68,.14);
  --warn:#ff8a4c;
  --mask:#2ee6d0; --sel:#ffd84a; --prop:#ff5ad9;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden}
body{font:13px/1.4 "Segoe UI","Malgun Gothic",sans-serif;color:var(--tx1);-webkit-font-smoothing:antialiased}
#app{width:1920px;height:1080px;display:grid;grid-template-columns:300px 1fr 344px;grid-template-rows:48px 1fr 28px;background:var(--bg1);transform-origin:0 0;position:absolute;left:0;top:0}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
kbd{display:inline-block;min-width:18px;height:18px;padding:0 5px;border-radius:4px;border:1px solid var(--line2);background:var(--bg3);color:var(--tx2);font:11px/16px "Cascadia Mono",Consolas,monospace;text-align:center}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.mono{font-family:"Cascadia Mono",Consolas,monospace}

.top{grid-column:1/4;display:flex;align-items:center;gap:16px;padding:0 14px;border-bottom:1px solid var(--line);background:var(--bg1)}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:14px}
.brand i{width:14px;height:14px;border-radius:50%;background:var(--accent);box-shadow:inset 0 0 0 3px var(--bg1),0 0 0 1.5px var(--accent)}
.proj{color:var(--tx2);padding-left:14px;border-left:1px solid var(--line)}
.steps{margin:0 auto;display:flex;align-items:center;gap:6px}
.step{display:flex;align-items:center;gap:7px;height:30px;padding:0 12px;border-radius:6px;color:var(--tx2)}
.step b{width:18px;height:18px;border-radius:50%;border:1px solid var(--line2);font:11px/16px "Segoe UI";text-align:center;font-weight:600}
.step.done b{background:var(--ok-bg);border-color:transparent;color:var(--ok)}
.step.on{background:var(--accent-bg);color:var(--tx1)}
.step.on b{background:var(--accent);border-color:var(--accent);color:#08111f}
.sep{width:18px;height:1px;background:var(--line2)}
.prog{display:flex;align-items:center;gap:10px;color:var(--tx2);font-size:12px}
.bar{width:120px;height:4px;border-radius:2px;background:var(--bg4);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.saved{display:flex;align-items:center;gap:5px;color:var(--tx3);font-size:12px}
.tbtn{display:flex;align-items:center;gap:6px;height:28px;padding:0 9px;border-radius:6px;border:1px solid var(--line);color:var(--tx2);font-size:12px}

.list{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.lh{padding:10px 12px 8px;border-bottom:1px solid var(--line)}
.lh h3{margin:0 0 8px;font-size:13px;font-weight:600;display:flex;justify-content:space-between}
.lh h3 span{color:var(--tx3);font-weight:400}
.seg{display:flex;background:var(--bg2);border-radius:6px;padding:2px;gap:2px}
.seg button{flex:1;height:24px;border-radius:4px;color:var(--tx2);font-size:12px}
.seg button.on{background:var(--bg4);color:var(--tx1)}
.lopt{display:flex;justify-content:space-between;align-items:center;margin-top:8px;color:var(--tx3);font-size:12px}
.chk{display:inline-flex;align-items:center;gap:6px;color:var(--tx2)}
.chk i{width:13px;height:13px;border-radius:3px;background:var(--accent);display:grid;place-items:center;color:#08111f}
.chk i svg{width:11px;height:11px;stroke-width:2.6}
.rows{flex:1;overflow:hidden}
.grp{display:flex;align-items:center;gap:8px;height:30px;padding:0 12px;background:var(--bg2);border-bottom:1px solid var(--line);font-size:12px;color:var(--tx2)}
.grp b{color:var(--tx1);font-weight:600}
.grp .cab{margin-left:auto;display:flex;gap:4px;font:10px "Cascadia Mono",Consolas;color:var(--tx3)}
.grp .cab span{width:10px;text-align:center}
.row{display:flex;align-items:center;gap:10px;height:54px;padding:0 12px 0 9px;border-bottom:1px solid var(--line);border-left:3px solid transparent;cursor:pointer}
.row:hover{background:var(--bg2)}
.row.cur{background:var(--accent-bg);border-left-color:var(--accent)}
.row img{width:60px;height:45px;border-radius:3px;display:block;background:#000;filter:brightness(1.55) contrast(1.04)}
.row .t{flex:1;min-width:0}
.row .t1{display:flex;gap:6px;align-items:baseline}
.row .t1 small{color:var(--tx3);font-size:11px}
.row .t2{color:var(--tx2);font-size:12px;display:flex;align-items:center;gap:5px}
.row .t2 svg{width:13px;height:13px;color:var(--warn)}
.dots{display:flex;gap:4px}
.dot{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--tx3)}
.dot.done{background:var(--ok);border-color:var(--ok)}
.dot.hold{background:var(--hold);border-color:var(--hold)}
.dot.edit{border-color:var(--accent);background:var(--accent-bg)}
.dot.dup{border:0;height:2px;margin-top:4px;border-radius:1px;background:var(--line2)}
.lf{display:flex;gap:6px;padding:8px 10px;border-top:1px solid var(--line)}
.lf button{flex:1;height:28px;border-radius:6px;border:1px solid var(--line);color:var(--tx2);font-size:12px;display:flex;align-items:center;justify-content:center;gap:6px}
.lf button.p{flex:1.5;border-color:var(--line2);color:var(--tx1)}

.stage{padding:10px 12px;display:flex;flex-direction:column;gap:8px;min-width:0;min-height:0;background:var(--bg0);position:relative}
.scenebar{height:40px;display:flex;align-items:center;gap:10px;flex:none}
.crumb{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px}
.crumb span{color:var(--tx3);font-weight:400}
.sync{color:var(--tx3);font-size:12px}
.vt{margin-left:auto;display:flex;align-items:center;gap:6px}
.tg{display:flex;align-items:center;gap:6px;height:28px;padding:0 9px;border-radius:6px;border:1px solid var(--line);color:var(--tx2);font-size:12px;background:var(--bg1)}
.tg.on{color:var(--tx1);border-color:var(--line2);background:var(--bg3)}
.slider{display:flex;align-items:center;gap:7px;color:var(--tx3);font-size:12px;padding:0 6px}
.slider u{display:block;width:74px;height:3px;border-radius:2px;background:var(--bg4);position:relative}
.slider u::after{content:"";position:absolute;left:46%;top:-4.5px;width:12px;height:12px;border-radius:50%;background:var(--tx2)}
.tiles{flex:1;display:grid;gap:10px;min-height:0}
.tiles.ov{grid-template-columns:repeat(3,minmax(0,1fr))}
.tiles.f0{grid-template-columns:minmax(0,1fr) 184px 184px}
.tiles.f1{grid-template-columns:184px minmax(0,1fr) 184px}
.tiles.f2{grid-template-columns:184px 184px minmax(0,1fr)}
.tile{background:var(--bg1);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
.tile.big{border-color:var(--accent)}
.th{height:34px;flex:none;display:flex;align-items:center;gap:8px;padding:0 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.th b{font-weight:600}
.th .meta{color:var(--tx3);font-size:12px}
.chip{margin-left:auto;display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:11px;font-size:12px;border:1px solid var(--line2);color:var(--tx2)}
.chip.done{border-color:transparent;background:var(--ok-bg);color:var(--ok)}
.chip.hold{border-color:transparent;background:var(--hold-bg);color:var(--hold)}
.chip.edit{border-color:transparent;background:var(--accent-bg);color:var(--accent)}
.chip svg{width:12px;height:12px;stroke-width:2.4}
.view{position:relative;background:#000;cursor:pointer;flex:none;overflow:hidden}
.view .im{position:absolute;inset:0;background-size:100% 100%}
.view svg.o,.vp svg.o{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.o .m{fill:rgba(46,230,208,.20);stroke:var(--mask);stroke-width:1.5;vector-effect:non-scaling-stroke;cursor:pointer}
.o.nofill .m{fill:none}
.o .m.s{fill:rgba(255,216,74,.05);stroke:var(--sel);stroke-width:2}
.o .bx{fill:none;stroke:#fff;stroke-width:1;vector-effect:non-scaling-stroke}
.o .bxs{fill:none;stroke:rgba(0,0,0,.6);stroke-width:3;vector-effect:non-scaling-stroke}
.o .tight{fill:none;stroke:var(--mask);stroke-width:1;stroke-dasharray:3 3;vector-effect:non-scaling-stroke}
.o .pr{fill:none;stroke:var(--prop);stroke-width:2;stroke-dasharray:6 4;vector-effect:non-scaling-stroke}
.num{position:absolute;transform:translate(-50%,-135%);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:rgba(13,15,18,.82);color:var(--mask);font:11px/16px "Segoe UI";font-weight:600;text-align:center;pointer-events:none}
.crops{padding:10px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-content:start}
.crop{cursor:pointer;min-width:0}
.crop .c{position:relative;aspect-ratio:1;border-radius:6px;overflow:hidden;background:#000;border:1px solid var(--line)}
.crop .c .bg{position:absolute;inset:0;background-repeat:no-repeat;image-rendering:pixelated}
.crop:hover .c{border-color:var(--tx3)}
.crop.s .c{border-color:var(--sel);box-shadow:0 0 0 1px var(--sel)}
.crop .c svg{position:absolute;inset:0;width:100%;height:100%}
.crop .cap{display:flex;gap:6px;align-items:center;height:22px;font-size:12px;color:var(--tx2)}
.crop .cap b{color:var(--tx1);font-weight:600}
.tag{margin-left:auto;font-size:11px;color:var(--tx3);border:1px solid var(--line);border-radius:4px;padding:0 5px;line-height:16px}
.add .c{border:1px dashed var(--line2);background:none;display:grid;place-items:center;color:var(--tx3);font-size:12px;text-align:center;line-height:1.5}
.add .c svg{position:static;width:18px;height:18px;margin:0 auto 4px;display:block}
.tile.sm .crops{padding:6px;gap:6px}
.tile.sm .crop .cap{height:18px;font-size:11px}
.tile.sm .th{padding:0 8px;gap:6px}
.vp{position:relative;flex:1;min-height:0;background:#000;overflow:hidden;cursor:grab}
.vp .im{position:absolute;background-size:100% 100%;image-rendering:pixelated}
.vp .grid{position:absolute;inset:0;pointer-events:none}
.rail{position:absolute;left:10px;top:10px;display:flex;flex-direction:column;gap:2px;padding:4px;border-radius:8px;background:rgba(21,24,28,.92);border:1px solid var(--line2)}
.rail button{width:36px;height:36px;border-radius:6px;color:var(--tx2);position:relative;display:grid;place-items:center}
.rail button svg{width:18px;height:18px}
.rail button em{position:absolute;right:3px;bottom:1px;font:9px "Cascadia Mono",Consolas;font-style:normal;color:var(--tx3)}
.rail button.on{background:var(--accent);color:#08111f}
.rail button.on em{color:#08111f}
.rail hr{width:24px;border:0;border-top:1px solid var(--line2);margin:3px auto}
.opt{position:absolute;left:66px;top:10px;height:36px;display:flex;align-items:center;gap:10px;padding:0 12px;border-radius:8px;background:rgba(21,24,28,.92);border:1px solid var(--line2);color:var(--tx2);font-size:12px;white-space:nowrap}
.opt b{color:var(--tx1);font-weight:600}
.opt .g{color:var(--ok)} .opt .r{color:#ff6b6b}
.zoom{position:absolute;right:10px;top:10px;height:28px;display:flex;align-items:center;gap:8px;padding:0 10px;border-radius:6px;background:rgba(21,24,28,.92);border:1px solid var(--line2);color:var(--tx2);font-size:12px}
.mini .im{position:absolute;inset:0;background-size:100% 100%;image-rendering:auto}
.mini{position:absolute;left:10px;bottom:10px;width:188px;height:141px;border:1px solid var(--line2);border-radius:6px;overflow:hidden;box-shadow:0 0 0 3px rgba(13,15,18,.6)}
.mini i{position:absolute;border:1.5px solid var(--sel);background:rgba(255,216,74,.12)}
.dim{position:absolute;transform:translate(-50%,-100%);margin-top:-8px;padding:1px 7px;border-radius:4px;background:rgba(13,15,18,.86);color:#fff;font:12px "Cascadia Mono",Consolas;white-space:nowrap;pointer-events:none}
.hd{position:absolute;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;background:#fff;border:1.5px solid #0d0f12;border-radius:2px;pointer-events:none}
.pt{position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;border:2px solid #fff;color:#fff;font:700 12px/12px "Segoe UI";text-align:center;pointer-events:none}
.pt.g{background:var(--ok-fill)} .pt.r{background:#e5484d}
.pbar{position:absolute;transform:translate(-50%,0);display:flex;align-items:center;gap:10px;height:34px;padding:0 6px 0 12px;border-radius:8px;background:rgba(21,24,28,.95);border:1px solid var(--prop);font-size:12px;white-space:nowrap}
.pbar span{color:var(--prop);font-weight:600}
.pbar button{height:24px;padding:0 9px;border-radius:5px;display:flex;align-items:center;gap:6px;border:1px solid var(--line2);color:var(--tx2)}
.pbar button.p{background:var(--ok-fill);border-color:var(--ok-fill);color:#fff}
.pbar button.p kbd,.act .p kbd{background:rgba(0,0,0,.22);border-color:transparent;color:#fff}
.hint{height:34px;flex:none;display:flex;align-items:center;gap:18px;color:var(--tx3);font-size:12px;padding:0 4px}
.hint span{display:flex;align-items:center;gap:6px}
.toast{position:absolute;left:50%;bottom:58px;transform:translateX(-50%);padding:9px 16px;border-radius:8px;background:var(--bg4);border:1px solid var(--line2);font-size:13px;opacity:0;transition:opacity .15s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}

.side{border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.sec{padding:12px 14px;border-bottom:1px solid var(--line)}
.sec h4{margin:0 0 8px;font-size:12px;font-weight:600;color:var(--tx2);display:flex;justify-content:space-between;align-items:center}
.sec h4 span{font-weight:400;color:var(--tx3)}
.og{display:flex;align-items:center;gap:7px;height:24px;font-size:12px;color:var(--tx3);margin-top:4px}
.og:first-of-type{margin-top:0}
.og .dot{width:8px;height:8px}
.ob{display:flex;align-items:center;gap:8px;height:30px;padding:0 8px;border-radius:6px;cursor:pointer;border:1px solid transparent}
.ob:hover{background:var(--bg2)}
.ob.s{background:rgba(255,216,74,.10);border-color:rgba(255,216,74,.45)}
.ob i{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--mask);color:var(--mask);font:600 11px/15px "Segoe UI";font-style:normal;text-align:center;flex:none}
.ob.s i{border-color:var(--sel);color:var(--sel)}
.ob .sz{color:var(--tx3);font:12px "Cascadia Mono",Consolas}
.ob .ed{color:var(--accent);font-size:11px}
.ob .ic{margin-left:auto;display:flex;gap:8px;color:var(--tx3)}
.ob .ic svg{width:14px;height:14px}
.kv{display:flex;align-items:center;justify-content:space-between;height:28px;font-size:12px;color:var(--tx2)}
.kv b{color:var(--tx1);font-weight:400}
.sw{width:30px;height:16px;border-radius:8px;background:var(--bg4);position:relative;display:inline-block;vertical-align:middle;margin-left:8px}
.sw::after{content:"";position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--tx2)}
.sw.on{background:var(--accent)} .sw.on::after{left:16px;background:#fff}
.nudge{margin-top:6px;border:1px solid var(--line);border-radius:8px;background:var(--bg2);padding:12px 10px 10px}
.pad{display:grid;grid-template-columns:1fr 104px 1fr;grid-template-rows:30px 78px 30px;gap:6px;align-items:center;justify-items:center}
.stp{display:flex;align-items:center;gap:0;border:1px solid var(--line2);border-radius:6px;overflow:hidden;background:var(--bg1)}
.stp button{width:26px;height:26px;display:grid;place-items:center;color:var(--tx2);font-size:15px}
.stp button:hover{background:var(--bg4);color:var(--tx1)}
.stp span{min-width:30px;text-align:center;font:12px "Cascadia Mono",Consolas;color:var(--tx1);border-left:1px solid var(--line2);border-right:1px solid var(--line2);line-height:26px}
.stp span.nz{color:var(--sel)}
.stp.v{flex-direction:column}
.stp.v span{border:0;border-top:1px solid var(--line2);border-bottom:1px solid var(--line2);width:100%}
.bxp{width:104px;height:78px;border:1.5px solid #fff;border-radius:2px;display:grid;place-items:center;position:relative;background:rgba(255,255,255,.03)}
.bxp::before{content:"";position:absolute;inset:9px 14px;border:1px dashed var(--mask);border-radius:50%;opacity:.7}
.bxp b{font:600 14px "Cascadia Mono",Consolas;position:relative}
.xy{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.xy div{background:var(--bg1);border:1px solid var(--line);border-radius:5px;padding:3px 7px;font:12px "Cascadia Mono",Consolas;display:flex;justify-content:space-between}
.xy div span{color:var(--tx3)}
.nf{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:12px;color:var(--tx3)}
.lnk{height:24px;padding:0 9px;border-radius:5px;border:1px solid var(--line2);color:var(--tx2);font-size:12px}
.keys{margin-top:8px;font-size:12px;color:var(--tx3);line-height:1.9}
.sum{display:flex;align-items:center;gap:8px;height:30px;font-size:13px}
.sum .n{margin-left:auto;color:var(--tx2)}
.note{margin-top:8px;font-size:12px;color:var(--tx3);line-height:1.6}
.act{margin-top:auto;padding:12px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.act .p{height:44px;border-radius:8px;background:var(--ok-fill);color:#fff;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px}
.act .p:hover{background:#23ad6e}
.act .r2{display:flex;gap:8px}
.act .r2 button{flex:1;height:32px;border-radius:6px;border:1px solid var(--line2);color:var(--tx2);font-size:12px;display:flex;align-items:center;justify-content:center;gap:7px}
.act p{margin:0;font-size:12px;color:var(--tx3)}

#app.page{grid-template-columns:1fr}
#app.page .list,#app.page .side{display:none}
#app.page .stage{padding:0}
.step{cursor:pointer}
.pw{padding:20px 28px;display:grid;grid-template-columns:minmax(0,1fr) 372px;gap:22px;height:100%;min-height:0;position:relative}
.ph{display:flex;align-items:flex-end;gap:16px;margin-bottom:14px}
.ph h1{margin:0;font-size:20px;font-weight:600}
.ph p{margin:3px 0 0;color:var(--tx2)}
.ph .sp{margin-left:auto;display:flex;gap:8px}
.btn{height:34px;padding:0 14px;border-radius:7px;border:1px solid var(--line2);color:var(--tx1);display:inline-flex;align-items:center;gap:8px;background:var(--bg2);white-space:nowrap}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#08111f;font-weight:600}
.btn.go{background:var(--ok-fill);border-color:var(--ok-fill);color:#fff;font-weight:600}
.btn.sm{height:28px;padding:0 10px;font-size:12px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px}
.card{background:var(--bg1);border:1px solid var(--line);border-radius:10px;padding:11px 14px}
.card small{color:var(--tx3);font-size:12px;display:block}
.card b{font:600 22px "Segoe UI","Malgun Gothic";display:block;margin:1px 0}
.card span{color:var(--tx2);font-size:12px}
.banner{display:flex;align-items:center;gap:12px;padding:9px 14px;border-radius:10px;border:1px solid rgba(91,157,255,.45);background:var(--accent-bg);margin-bottom:12px}
.banner svg{color:var(--accent)}
.banner .mono{color:var(--tx2);font-size:12px}
.banner .btn{margin-left:auto}
.tbl{background:var(--bg1);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tr{display:grid;grid-template-columns:30px 230px 110px 170px minmax(0,1.25fr) minmax(0,1fr) minmax(0,1fr) 92px;align-items:center;gap:0 16px;min-height:45px;padding:0 16px;border-bottom:1px solid var(--line)}
.tr:last-child{border-bottom:0}
.tr.hd2{min-height:32px;color:var(--tx3);font-size:12px;background:var(--bg2)}

<body>
<div id="app">
  <header class="top" id="top"></header>
  <aside class="list" id="list"></aside>
  <main class="stage" id="stage"></main>
  <aside class="side" id="side"></aside>
  <footer class="status" id="status"></footer>
</div>
<script src="mock-data.js"></script>
<script>
const P = {
  cursor:'<path d="M5 3l14 7-6 2-2 6z"/>',
  ai:'<path d="M11 3l1.9 5.1L18 10l-5.1 1.9L11 17l-1.9-5.1L4 10l5.1-1.9z"/><path d="M18.5 15l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z"/>',
  brush:'<path d="M9.5 14.5L19 4.5a1.6 1.6 0 012.2 2.3L11.5 16.6"/><path d="M4 20c2.8.3 6.6-.4 6.9-3.2.2-1.7-1.1-3-2.8-2.8C5.6 14.3 5.6 17.5 4 20z"/>',
  poly:'<path d="M12 4l7.5 5.5L16.5 19h-9L4.5 9.5z"/>',
  box:'<rect x="4" y="6" width="16" height="12" rx="1"/>',
  undo:'<path d="M8 6L3 11l5 5"/><path d="M3 11h11a6 6 0 010 12h-2" transform="translate(0 -3)"/>',
  redo:'<path d="M16 6l5 5-5 5"/><path d="M21 11H10a6 6 0 000 12h2" transform="translate(0 -3)"/>',
  fit:'<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>',
  target:'<circle cx="12" cy="12" r="5"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/>',
  eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  trash:'<path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7"/>',
  down:'<path d="M6 9l6 6 6-6"/>',
  left:'<path d="M15 6l-6 6 6 6"/>',
  right:'<path d="M9 6l6 6-6 6"/>',
  warn:'<path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17v.5"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  help:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 115 0c0 1.6-2.5 2-2.5 3.8M12 17v.5"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.4 1.4M17.6 17.6L19 19M19 5l-1.4 1.4M6.4 17.6L5 19"/>',
  layer:'<path d="M12 4l9 5-9 5-9-5z"/><path d="M3 14l9 5 9-5"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  loupe:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/>',
  folder:'<path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>',
  refresh:'<path d="M20 11a8 8 0 10-2.3 5.7"/><path d="M20 4v7h-7"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.5v.5"/>',
  shield:'<path d="M12 3l8 3v6c0 4.5-3.4 7.7-8 9-4.6-1.3-8-4.5-8-9V6z"/><path d="M9 12l2 2 4-4"/>',
  save:'<path d="M5 12.5l4.5 4.5L19 7"/>'
};
const ic = n => `<svg class="i" viewBox="0 0 24 24">${P[n]}</svg>`;
const CAM = MOCK.main.frames, W = 1440, H = 1080;
const q = new URLSearchParams(location.search);
const S = {stage:q.get('stage') || 'review', dialog:false, assign:{1:'test',2:'train',3:'train',4:'train',5:'train',6:'train',7:'val',8:'train',9:'train'}, groups:{8:'A',9:'A'}, focus:null, sel:null, tool:'select', mask:true, box:false, proposal:false, view:null,
           review:['todo','todo','todo'], off:{}, gone:{}, occ:{}, edited:{}};
const k = (c,b) => c+'-'+b;
const off = (c,b) => S.off[k(c,b)] || (S.off[k(c,b)] = {t:0,r:0,b:0,l:0});
const dbox = (c,b) => { const [x,y,w,h] = CAM[c].boxes[b].bbox, o = off(c,b); return [x-o.l, y-o.t, w+o.l+o.r, h+o.t+o.b]; };
const balls = c => CAM[c].boxes.map((_,b) => b).filter(b => !S.gone[k(c,b)]);
const isSel = (c,b) => S.sel && S.sel.c === c && S.sel.b === b;
const SRC = {auto_sam:'SAM', auto_tracking:'추적', manual:'수동'};
const STATE = {todo:'미검수', done:'확인됨', hold:'보류', edit:'수정 중'};
const camState = c => S.review[c] === 'todo' && S.edited[c] ? 'edit' : S.review[c];
const BR = c => c === 0 ? 'filter:brightness(1.55) contrast(1.04);' : '';
const pts = poly => poly.map(p => (p[0]+.5)+','+(p[1]+.5)).join(' ');

function masks(c, withBox){
  return balls(c).map(b => {
    const box = CAM[c].boxes[b], s = isSel(c,b), [x,y,w,h] = dbox(c,b), o = off(c,b);
    let g = box.contours.map(p => `<polygon class="m${s?' s':''}" data-act="ball" data-c="${c}" data-b="${b}" points="${pts(p)}"/>`).join('');
    if (withBox && (S.box || s)) {
      if (s && (o.t||o.r||o.b||o.l)) { const [bx,by,bw,bh] = box.bbox; g += `<rect class="tight" x="${bx}" y="${by}" width="${bw}" height="${bh}"/>`; }
      g += `<rect class="bxs" x="${x}" y="${y}" width="${w}" height="${h}"/><rect class="bx" x="${x}" y="${y}" width="${w}" height="${h}"/>`;
    }
    return g;
  }).join('');
}
function nums(c){
  return balls(c).map((b,i) => { const [x,y,w] = dbox(c,b);
    return `<span class="num" style="left:${(x+w/2)/W*100}%;top:${y/H*100}%${isSel(c,b)?';color:var(--sel)':''}">${i+1}</span>`; }).join('');
}
function crop(c, b, i, small){
  const box = CAM[c].boxes[b], [x,y,w,h] = dbox(c,b), R = Math.max(w,h)*2.1, cx = x+w/2, cy = y+h/2, o = off(c,b);
  const x0 = cx-R/2, y0 = cy-R/2, s = isSel(c,b);
  const style = `${BR(c)}background-image:url(${CAM[c].file});background-size:${W/R*100}% ${H/R*100}%;background-position:${x0/(W-R)*100}% ${y0/(H-R)*100}%`;
  let g = box.contours.map(p => `<polygon class="m${s?' s':''}" points="${pts(p)}"/>`).join('');
  if (S.box || o.t||o.r||o.b||o.l) g += `<rect class="bxs" x="${x}" y="${y}" width="${w}" height="${h}"/><rect class="bx" x="${x}" y="${y}" width="${w}" height="${h}"/>`;
  return `<div class="crop${s?' s':''}" data-act="ball" data-c="${c}" data-b="${b}"><div class="c"><div class="bg" style="${style}"></div>
    <svg class="o nofill" viewBox="${x0} ${y0} ${R} ${R}">${g}</svg></div>
    <div class="cap"><b>${i+1}</b>${small?'':`<span class="mono">${w}×${h}</span>`}${S.edited[k(c,b)]?'<span style="color:var(--accent)">수정됨</span>':''}<span class="tag">${SRC[box.source]}</span></div></div>`;
}
function chip(c){ const st = camState(c); return `<span class="chip ${st}" data-act="toggle" data-c="${c}">${st==='done'?ic('check'):''}${STATE[st]}</span>`; }
function tileOv(c){
  const f = CAM[c], list = balls(c);
  return `<section class="tile"><div class="th"><kbd>${c+1}</kbd><b>${f.kind} ${f.key}</b><span class="meta">공 ${list.length}개</span>${chip(c)}</div>
    <div class="view" style="aspect-ratio:4/3" data-act="focus" data-c="${c}"><div class="im" style="${BR(c)}background-image:url(${f.file})"></div>
      <svg class="o${S.mask?'':' nofill'}" viewBox="0 0 ${W} ${H}">${masks(c,true)}</svg>${nums(c)}</div>
    <div class="crops">${list.map((b,i) => crop(c,b,i)).join('')}
      <div class="crop add" data-act="add" data-c="${c}"><div class="c"><div>${ic('plus')}빠진 공 추가<br>영상에서 공을 클릭</div></div></div></div></section>`;
}
function tileSm(c){
  const f = CAM[c], list = balls(c), st = camState(c);
  return `<section class="tile sm"><div class="th"><kbd>${c+1}</kbd><b>${f.kind} ${f.key}</b><span class="dot ${st}" style="margin-left:auto"></span></div>
    <div class="view" style="aspect-ratio:4/3" data-act="focus" data-c="${c}"><div class="im" style="${BR(c)}background-image:url(${f.file})"></div>
      <svg class="o${S.mask?'':' nofill'}" viewBox="0 0 ${W} ${H}">${masks(c,false)}</svg></div>
    <div class="crops">${list.map((b,i) => crop(c,b,i,true)).join('')}</div></section>`;
}
const TOOLS = [['select','cursor','V','선택'],['ai','ai','S','AI 분할'],['brush','brush','B','브러시'],['poly','poly','P','폴리곤'],['box','box','R','박스']];
const OPT = {
  select:'<b>선택</b> 공을 클릭 · 빈 곳을 끌면 화면 이동 · 방향키로 박스 경계 1픽셀',
  ai:'<b>AI 분할</b> <span class="g">왼쪽 클릭 포함</span> · <span class="r">오른쪽 클릭 제외</span> · 끌어서 박스 지정 · <kbd>Enter</kbd> 반영',
  brush:'<b>브러시</b> 왼쪽 버튼으로 칠하기 · 오른쪽 버튼으로 지우기 · <kbd>[</kbd> <kbd>]</kbd> 굵기 7px',
  poly:'<b>폴리곤</b> 둘레를 따라 클릭 · <kbd>Enter</kbd> 닫기 · <kbd>Ctrl</kbd>+<kbd>Z</kbd> 마지막 점 취소',
  box:'<b>박스</b> 끌어서 사각형 그리기 · 마스크 없이 박스만 저장'
};
let VP = {w:864, h:858};
function viewOf(c){
  if (S.view) return S.view;
  if (S.sel && S.sel.c === c) { const [x,y,w,h] = dbox(c,S.sel.b), s = Math.min(14, Math.max(.6, VP.h*.34/Math.max(w,h)));
    return {s, tx:VP.w/2-(x+w/2)*s, ty:VP.h/2-(y+h/2)*s}; }
  const s = Math.min(VP.w/W, VP.h/H); return {s, tx:(VP.w-W*s)/2, ty:(VP.h-H*s)/2};
}
function tileBig(c){
  const f = CAM[c], v = viewOf(c), vb = `${-v.tx/v.s} ${-v.ty/v.s} ${VP.w/v.s} ${VP.h/v.s}`;
  let extra = '';
  if (S.sel && S.sel.c === c) {
    const [x,y,w,h] = dbox(c,S.sel.b), sx = n => n*v.s+v.tx, sy = n => n*v.s+v.ty;
    extra += `<span class="dim" style="left:${sx(x+w/2)}px;top:${sy(y)}px">${w} × ${h} px</span>`;
    [[x+w/2,y],[x+w,y+h/2],[x+w/2,y+h],[x,y+h/2]].forEach(p => extra += `<i class="hd" style="left:${sx(p[0])}px;top:${sy(p[1])}px"></i>`);
    if (S.proposal) {
      extra += `<i class="pt g" style="left:${sx(x+w*.42)}px;top:${sy(y+h*.5)}px">+</i><i class="pt r" style="left:${sx(x+w*1.12)}px;top:${sy(y+h*.9)}px">−</i>`;
      extra += `<div class="pbar" style="left:${sx(x+w/2)}px;top:${sy(y+h)+22}px"><span>제안 미확정</span><button class="p" data-act="apply">반영 <kbd>Enter</kbd></button><button data-act="cancel">취소 <kbd>Esc</kbd></button></div>`;
    }
  }
  let prop = '';
  if (S.proposal && S.sel && S.sel.c === c) {
    const [x,y,w,h] = dbox(c,S.sel.b), cx = x+w/2, cy = y+h/2;
    prop = CAM[c].boxes[S.sel.b].contours.map(p => `<polygon class="pr" points="${p.map(q => (cx+(q[0]+.5-cx)*.93)+','+(cy+(q[1]+.5-cy)*.93)).join(' ')}"/>`).join('');
  }
  const grid = v.s >= 5 ? `<div class="grid" style="background-image:linear-gradient(to right,rgba(255,255,255,.09) 1px,transparent 1px),linear-gradient(to bottom,rgba(255,255,255,.09) 1px,transparent 1px);background-size:${v.s}px ${v.s}px;background-position:${v.tx%v.s}px ${v.ty%v.s}px"></div>` : '';
  return `<section class="tile big"><div class="th"><kbd>${c+1}</kbd><b>${f.kind} ${f.key}</b><span class="meta">프레임 ${f.index} · 공 ${balls(c).length}개 · 수신 시각 ${f.delta_ms>=0?'+':''}${f.delta_ms.toFixed(2)}ms</span>${chip(c)}</div>
    <div class="vp" id="vp" data-c="${c}"><div class="im" style="${BR(c)}background-image:url(${f.file});left:${v.tx}px;top:${v.ty}px;width:${W*v.s}px;height:${H*v.s}px"></div>${grid}
      <svg class="o${S.mask?'':' nofill'}" viewBox="${vb}" preserveAspectRatio="none">${masks(c,true)}${prop}</svg>${extra}
      <div class="rail">${TOOLS.map(t => `<button class="${S.tool===t[0]?'on':''}" data-act="tool" data-t="${t[0]}" title="${t[3]}">${ic(t[1])}<em>${t[2]}</em></button>`).join('')}<hr>
        <button data-act="undo" title="실행 취소">${ic('undo')}</button><button title="다시 실행">${ic('redo')}</button><hr>
        <button data-act="fit" title="화면 맞춤">${ic('fit')}<em>F</em></button><button data-act="zoomsel" title="선택한 공으로 확대">${ic('target')}<em>Z</em></button></div>
      <div class="opt">${OPT[S.tool]}</div>
      <div class="zoom"><span class="mono">${Math.round(v.s*100)}%</span><span>원본 1픽셀 = 화면 ${v.s.toFixed(1)}픽셀</span></div>
      <div class="mini"><div class="im" style="${BR(c)}background-image:url(${f.file})"></div><i style="left:${Math.max(0,-v.tx/v.s/W*100)}%;top:${Math.max(0,-v.ty/v.s/H*100)}%;width:${Math.min(100,VP.w/v.s/W*100)}%;height:${Math.min(100,VP.h/v.s/H*100)}%"></i></div></div></section>`;

let toastTimer;
function toast(t){ const el = document.getElementById('toast'); if (!el) return; el.textContent = t; el.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('on'), 2200); }
function select(c,b){ S.focus = c; S.sel = {c,b}; S.view = null; S.proposal = false; render(); }

function cycle(dir){
